name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Byte-compile every tool (syntax check)
        run: python -m compileall -q tools tests
      - name: Bootstrap a demo brain
        run: ./bootstrap.sh --owner ci --demo
      - name: Test suites
        run: make test
      - name: Full verify
        run: make verify
      - name: Sandbox works from a clean checkout
        run: make sandbox
