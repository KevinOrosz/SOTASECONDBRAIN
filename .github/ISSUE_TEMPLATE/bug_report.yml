name: Bug report
description: Something broke or behaved unexpectedly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Use the demo or a synthetic page to describe what you ran and what you expected.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Failing check and redacted result
      description: Share the check name and RESULT line only. Remove personal paths, source names, queries, addresses and credentials. Report sensitive details privately via SECURITY.md.
      render: text
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "macOS 15, Python 3.12, agent tool if any"
    validations:
      required: true
